<!doctype html>
<html lang="ar" dir="rtl" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon-64.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2160eb" />

    <!-- Set theme + language on <html> BEFORE first paint so the page never
         flashes the wrong mode/direction while React boots. Defaults: dark
         theme and Arabic (RTL); a prior explicit choice in localStorage wins. -->
    <script>
      (function () {
        try {
          var theme = localStorage.getItem("auto-market-theme");
          document.documentElement.setAttribute(
            "data-theme",
            theme === "light" ? "light" : "dark"
          );
          var lang = localStorage.getItem("auto-market-lang");
          lang = lang === "fr" ? "fr" : "ar";
          document.documentElement.lang = lang;
          document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>

    <title>Pièces & Accessoires Auto, Paiement à la Livraison | Auto Market</title>
    <meta
      name="description"
      content="Des milliers de pièces et accessoires auto vérifiés, livrés partout en Algérie. Paiement à la livraison, stock vérifié en temps réel, devis rapide."
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://www.auto-market.shop/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Auto Market" />
    <meta property="og:title" content="Pièces & Accessoires Auto, Paiement à la Livraison | Auto Market" />
    <meta
      property="og:description"
      content="Des milliers de pièces et accessoires auto vérifiés, livrés partout en Algérie. Paiement à la livraison, stock vérifié en temps réel, devis rapide."
    />
    <meta property="og:url" content="https://www.auto-market.shop/" />
    <meta property="og:image" content="https://www.auto-market.shop/og-image.png" />
    <meta property="og:image:secure_url" content="https://www.auto-market.shop/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Auto Market — pièces et accessoires automobiles en Algérie" />
    <meta property="og:locale" content="fr_DZ" />
    <meta property="og:locale:alternate" content="ar_DZ" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Pièces & Accessoires Auto, Paiement à la Livraison | Auto Market" />
    <meta
      name="twitter:description"
      content="Des milliers de pièces et accessoires auto vérifiés, livrés partout en Algérie. Paiement à la livraison, stock vérifié en temps réel, devis rapide."
    />
    <meta name="twitter:image" content="https://www.auto-market.shop/og-image.png" />
    <meta name="twitter:image:alt" content="Auto Market — pièces et accessoires automobiles en Algérie" />

    <!-- Supabase: the first product query and every product image come from
         here, so pay the DNS/TLS cost up front instead of on first paint. -->
    <link rel="preconnect" href="https://yijhcjjjizwdckrvoptc.supabase.co" crossorigin />

    <!-- The hero car GLB is NOT preloaded here on purpose: index.html is served
         for every route, so a blanket preload made /checkout and /admin download
         122 KB they never use. HeroScene warms it instead, on the one page that
         renders it. -->

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600;700&family=Cairo:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Store",
        "name": "Auto Market",
        "url": "https://www.auto-market.shop/",
        "logo": "https://www.auto-market.shop/icon-512.png",
        "image": "https://www.auto-market.shop/og-image.png",
        "description": "Pièces et accessoires automobiles avec paiement à la livraison en Algérie.",
        "areaServed": "Algérie",
        "paymentAccepted": "Cash on delivery",
        "sameAs": [
          "https://www.instagram.com/automarket.shop_/",
          "https://www.tiktok.com/@automarket.shop_"
        ]
      }
    </script>

    <!-- Meta Pixel (replace YOUR_PIXEL_ID before going live) -->
    <script>
      !(function (f, b, e, v, n, t, s) {
        if (f.fbq) return;
        n = f.fbq = function () {
          n.callMethod ? n.callMethod.apply(n, arguments) : n.queue.push(arguments);
        };
        if (!f._fbq) f._fbq = n;
        n.push = n;
        n.loaded = !0;
        n.version = "2.0";
        n.queue = [];
        t = b.createElement(e);
        t.async = !0;
        t.src = v;
        s = b.getElementsByTagName(e)[0];
        s.parentNode.insertBefore(t, s);
      })(window, document, "script", "https://connect.facebook.net/en_US/fbevents.js");
      fbq("init", "YOUR_PIXEL_ID");
      fbq("track", "PageView");
    </script>
  </head>
  <body>
    <noscript>
      <img
        height="1"
        width="1"
        style="display: none"
        src="https://www.facebook.com/tr?id=YOUR_PIXEL_ID&ev=PageView&noscript=1"
      />
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
